<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>QuickTasks</h1>
            <p>Your yellow & white task manager</p>
        </header>

        <main class="app-main">
            <!-- Task Input Form -->
            <section class="task-form-section">
                <form id="taskForm" autocomplete="off">
                    <div class="input-group">
                        <input type="text" id="taskInput" placeholder="What needs to be done?" />
                        <select id="prioritySelect">
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Low">Low</option>
                        </select>
                        <input type="date" id="dueDateInput" />
                        <button type="submit" id="addBtn">Add Task</button>
                    </div>
                    <div id="errorMsg" class="error-msg" style="display: none;"></div>
                </form>
            </section>

            <!-- Filter Tabs & Clear Completed -->
            <section class="controls-section">
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
            </section>

            <!-- Task List Container (Card Layout) -->
            <section class="task-list-section">
                <div id="taskList" class="task-list">
                    <!-- Tasks rendered dynamically -->
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <p>No tasks found. Add a new task above!</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 QuickTasks. Built with Comic Sans & Yellow-White Theme.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>

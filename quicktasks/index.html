<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTasks - Yellow & White Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" role="application" aria-label="QuickTasks Application">
        <header class="app-header">
            <h1>QuickTasks</h1>
            <p>Your delightful yellow & white task manager</p>
        </header>

        <main class="app-main">
            <!-- Task Input Form -->
            <section class="task-form-section" aria-labelledby="formTitle">
                <h2 id="formTitle" class="visually-hidden">Add or Edit Task</h2>
                <form id="taskForm" autocomplete="off">
                    <div class="input-group">
                        <label for="taskInput" class="visually-hidden">Task Description</label>
                        <input type="text" id="taskInput" placeholder="What needs to be done?" aria-label="What needs to be done?" required />
                        
                        <label for="prioritySelect" class="visually-hidden">Task Priority</label>
                        <select id="prioritySelect" aria-label="Task Priority">
                            <option value="Medium">Medium Priority</option>
                            <option value="High">High Priority</option>
                            <option value="Low">Low Priority</option>
                        </select>
                        
                        <label for="dueDateInput" class="visually-hidden">Due Date</label>
                        <input type="date" id="dueDateInput" aria-label="Task Due Date" />
                        
                        <button type="submit" id="addBtn">Add Task</button>
                    </div>
                    <div id="errorMsg" class="error-msg" role="alert" style="display: none;"></div>
                </form>
            </section>

            <!-- Filter Tabs & Clear Completed -->
            <section class="controls-section" aria-label="Task Controls">
                <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="Filter Tasks">
                    <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All Tasks</button>
                    <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
                    <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
                </div>
                <button id="clearCompletedBtn" class="clear-btn" aria-label="Clear all completed tasks">Clear Completed</button>
            </section>

            <!-- Task List Container (Card Layout) -->
            <section class="task-list-section" aria-label="Task List">
                <div id="taskList" class="task-list" role="list">
                    <!-- Tasks rendered dynamically -->
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <p>✨ No tasks found. Add a new task above and stay organized!</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 QuickTasks. Built with Comic Sans & Yellow-White Theme.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
